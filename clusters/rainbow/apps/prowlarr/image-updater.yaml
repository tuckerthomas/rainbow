apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: prowlarr-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: prowlarr
      images:
        - alias: prowlarr
          imageName: ghcr.io/linuxserver/prowlarr:nightly
          commonUpdateSettings:
            forceUpdate: true
            updateStrategy: digest
            platforms:
            - linux/arm64
            - linux/amd64
