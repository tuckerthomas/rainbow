apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
  namespace: argocd
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  source:
    repoURL: https://k8s-at-home.com/charts
    targetRevision: 16.3.2

    chart: radarr
    helm:
      valuesObject:
        env:
          PUID: 1038
          PGID: 65538
          TZ: UTC
        securityContext:
          fsGroup: 65538
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/linuxserver/radarr
          tag: nightly-6.1.1.10317-ls29
        ingress:
          main:
            enabled: false
        #initContainers:
        #  update-config-permission:
        #    command:
        #    - sh
        #    - -c
        #    - chown -R 1038:65538 /config
        #    image: busybox
        #    securityContext:
        #      runAsUser: 0
        #    volumeMounts:
        #    - mountPath: /config
        #      name: config
          #update-media-permission:
          #  command:
          #  - sh
          #  - -c
          #  - chown -R 1038:65538 /movies
          #  image: busybox
          #  securityContext:
          #    runAsUser: 0
          #  volumeMounts:
          #  - mountPath: /movies
          #    name: movies
        metrics:
          enabled: false
          exporter:
            env:
              additionalMetrics: false
              port: 9794
              unknownQueueItems: false
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/onedr0p/exportarr
              tag: v1.0.0
          prometheusRule:
            enabled: false
            labels: {}
            rules: []
          serviceMonitor:
            interval: 3m
            labels: {}
            scrapeTimeout: 1m
        persistence:
          config:
            enabled: true
            existingClaim: radarr
          downloads:
            enabled: true
            mountPath: /downloads
            existingClaim: media-nfs-downloads
            #type: custom
            #volumeSpec:
            #  nfs:
            #    path: /volume1/Media/downloads
            #    server: 192.168.1.10
          movies:
            enabled: true
            mountPath: /movies
            existingClaim: media-nfs-movies
            #type: custom
            #volumeSpec:
            #  nfs:
            #    path: /volume1/Media/movies
            #    server: 192.168.1.10
        service:
          main:
            ports:
              http:
                port: 7878
                targetPort: 7878
            type: NodePort
        
        