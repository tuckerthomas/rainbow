apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # TODO: Check if sonarr gets postgres support https://github.com/Sonarr/Sonarr/pull/4999
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

  source:
    repoURL: https://k8s-at-home.com/charts
    targetRevision: 16.3.2

    chart: sonarr
    helm:
      valuesObject:
        env:
          PUID: 1038
          PGID: 65538
          TZ: UTC
        # Check chart documentation
        #securityContext:
        #  runAsUser: 1038
        #  runAsGroup: 65538
        #  fsGroup: 65538
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/linuxserver/sonarr
          tag: 4.0.17.2952-ls305
        ingress:
          main:
            enabled: false
        #initContainers:
        #  update-volume-permission:
        #    command:
        #    - sh
        #    - -c
        #    - chown -R 1038:65538 /config
        #    image: busybox
        #    securityContext:
        #      runAsUser: 0
        #    volumeMounts:
        #    - mountPath: /config
        #      name: config
        metrics:
          enabled: false
          exporter:
            env:
              additionalMetrics: false
              port: 9794
              unknownQueueItems: false
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/onedr0p/exportarr
              tag: v1.0.0
          prometheusRule:
            enabled: false
            labels: {}
            rules: []
          serviceMonitor:
            interval: 3m
            labels: {}
            scrapeTimeout: 1m
        persistence:
          config:
            enabled: true
            existingClaim: sonarr-config
          downloads:
            enabled: true
            mountPath: /downloads
            existingClaim: media-nfs-downloads
          tv:
            enabled: true
            mountPath: /tv
            existingClaim: media-nfs-tv
        service:
          main:
            ports:
              http:
                port: 8989
                targetPort: 8989
            type: NodePort
