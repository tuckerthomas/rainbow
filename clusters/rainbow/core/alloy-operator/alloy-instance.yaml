---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-logs
  namespace: system-monitoring
spec:
  controller:
    type: daemonset
    tolerations:
      - effect: NoSchedule
        operator: Exists
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  alloy:
    stabilityLevel: "generally-available"

    # Mount /var/log so each pod can read node-level logs
    mounts:
      varlog: true

    # --- RIVER CONFIG ---
    configMap:
      content: |
        // Discover all pods for container logs
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Relabel: attach k8s metadata as Loki labels + construct file paths
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            target_label  = "container_runtime"
            regex         = "^(\\S+):\\/\\/.+$"
            replacement   = "$1"
          }
        }

        // Collect pod/container logs
        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.loki.receiver]
        }

        // Collect systemd journal entries from each node
        loki.source.journal "journal" {
          path       = "/var/log/journal"
          labels     = { host = "host.label" }
          forward_to = [loki.write.loki.receiver]
        }

        // Ship all logs to Loki
        loki.write "loki" {
          endpoint {
            url = "http://loki-headless.system-monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
