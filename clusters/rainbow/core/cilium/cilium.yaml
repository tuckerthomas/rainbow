apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  # OCI is not supported yet in the sources key? Shrug. Swapping to git for now.
  sources:
  - repoURL: https://helm.cilium.io/
    targetRevision: 1.19.4
    chart: cilium
    helm:
      valueFiles:
      - $rainbow/clusters/rainbow/core/cilium/values.yaml
  - repoURL: http://cyan.rainbow.tuckerthomas.com:4000/tuckerthomas/rainbow
    targetRevision: argo
    ref: rainbow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true