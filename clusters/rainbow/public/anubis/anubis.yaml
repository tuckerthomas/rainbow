---
# Forward authentication to example.com
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: anubis-auth
  namespace: public
spec:
  forwardAuth:
    address: http://anubis.public.svc.cluster.local:8080/.within.website/x/cmd/anubis/api/check
    trustForwardHeader: true
